# Host nginx on the HTWG VM: TLS for both host names, forwards to the stack.
# Copy to /etc/nginx/sites-available/teamable-dev and replace the placeholders
# (backend-htwg-vm.md, section 5).
#
#   <teamable-host>  e.g. teamable-dev.<subdomain>.htwg-konstanz.de
#   <moodle-host>    e.g. moodle-dev.<subdomain>.htwg-konstanz.de

server {
    listen 80;
    server_name <teamable-host> <moodle-host>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <teamable-host>;

    ssl_certificate     /etc/ssl/teamable/teamable-dev.fullchain.pem;
    ssl_certificate_key /etc/ssl/teamable/teamable-dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        include snippets/teamable-proxy.conf;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name <moodle-host>;

    ssl_certificate     /etc/ssl/teamable/teamable-dev.fullchain.pem;
    ssl_certificate_key /etc/ssl/teamable/teamable-dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Course backups and file uploads in Moodle
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8008;
        include snippets/teamable-proxy.conf;
    }
}
